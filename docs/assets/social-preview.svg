<text x="96" y="572" font-size="20" fill="#9198a1" class="mono">github.com/analienx/model-router</text>
<text x="1184" y="572" font-size="20" fill="#9198a1" text-anchor="end">MIT · Python 3.8+ · no dependencies</text>
