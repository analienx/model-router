<text x="96" y="318" font-size="34" fill="#9198a1">Difficulty-based model routing for Claude Code</text>
<text x="96" y="372" font-size="25" fill="#e6edf3">A judge rates every prompt. Haiku does the easy work.</text>
<text x="96" y="408" font-size="25" fill="#e6edf3">Sonnet and Opus get the rest, and hooks enforce it.</text>
