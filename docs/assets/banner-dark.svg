<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-labelledby="title desc">
<title id="title">model-router</title>
<desc id="desc">Difficulty-based model routing for Claude Code: a judge rates each prompt and routes it to FAST (Haiku), STANDARD (Sonnet) or DEEP (Opus); a guard hook enforces the verdict.</desc>
<style>
text{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif}
.mono{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace}
.flow{stroke-dasharray:2 12;stroke-linecap:round;animation:flow 1.4s linear infinite}
.d1{animation-delay:-.47s}.d2{animation-delay:-.93s}
@keyframes flow{to{stroke-dashoffset:-28}}
@media (prefers-reduced-motion:reduce){.flow{animation:none}}
</style>
<defs>
<linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#14b8a6"/><stop offset=".55" stop-color="#6366f1"/><stop offset="1" stop-color="#f97316"/>
</linearGradient>
<pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1.1" fill="#262c36"/></pattern>
<radialGradient id="glow-a" cx=".78" cy=".15" r=".6"><stop offset="0" stop-color="#818cf8" stop-opacity="0.16"/><stop offset="1" stop-color="#818cf8" stop-opacity="0"/></radialGradient>
<radialGradient id="glow-b" cx=".98" cy="1" r=".5"><stop offset="0" stop-color="#fb923c" stop-opacity="0.16"/><stop offset="1" stop-color="#fb923c" stop-opacity="0"/></radialGradient>
<radialGradient id="glow-c" cx=".05" cy="1" r=".45"><stop offset="0" stop-color="#2dd4bf" stop-opacity="0.16"/><stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/></radialGradient>
<linearGradient id="fade" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity=".15"/><stop offset=".5" stop-color="#fff" stop-opacity=".45"/><stop offset="1" stop-color="#fff" stop-opacity="1"/></linearGradient>
<mask id="fade-mask"><rect width="100%" height="100%" fill="url(#fade)"/></mask>
<marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9198a1"/></marker>
<marker id="arrow-deep" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#fb923c"/></marker>
<marker id="arrow-guard" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#ff7b72"/></marker>
</defs>
<rect width="1280" height="400" rx="24" fill="#0d1117"/>
<rect width="1280" height="400" rx="24" fill="url(#dots)" mask="url(#fade-mask)"/>
<rect width="1280" height="400" rx="24" fill="url(#glow-a)"/>
<rect width="1280" height="400" rx="24" fill="url(#glow-b)"/>
<rect width="1280" height="400" rx="24" fill="url(#glow-c)"/>
<rect x=".5" y=".5" width="1279" height="399" rx="23.5" fill="none" stroke="#30363d"/>
<g transform="translate(80 108) scale(1.1250)"><rect width="64" height="64" rx="17" fill="url(#mark)"/><g fill="none" stroke="#fff" stroke-width="3.6" stroke-linecap="round"><path d="M22 32 C33 32 33 18 44 18"/><path d="M22 32 H44"/><path d="M22 32 C33 32 33 46 44 46"/></g><g fill="#fff"><circle cx="17" cy="32" r="5.5"/><circle cx="47.5" cy="18" r="4.2"/><circle cx="47.5" cy="32" r="4.2"/><circle cx="47.5" cy="46" r="4.2"/></g></g>
<text x="172" y="168" font-size="64" font-weight="750" letter-spacing="-1.5" fill="#e6edf3">model-router</text>
<text x="80" y="232" font-size="25" fill="#9198a1">Difficulty-based model routing for Claude Code</text>
<rect x="80" y="262" width="179" height="34" rx="17" fill="#161b22" stroke="#30363d"/><text x="169.5" y="284" font-size="15" fill="#e6edf3" text-anchor="middle">judge before work</text>
<rect x="269" y="262" width="145" height="34" rx="17" fill="#161b22" stroke="#30363d"/><text x="341.5" y="284" font-size="15" fill="#e6edf3" text-anchor="middle">hook-enforced</text>
<rect x="424" y="262" width="188" height="34" rx="17" fill="#161b22" stroke="#30363d"/><text x="518.0" y="284" font-size="15" fill="#e6edf3" text-anchor="middle">429-aware fallback</text>
<rect x="660" y="180" width="104" height="40" rx="20" fill="#161b22" stroke="#30363d"/>
<text x="712" y="205" font-size="15" fill="#e6edf3" text-anchor="middle">prompt</text>
<path d="M764 200 H814" stroke="#30363d" stroke-width="2"/>
<path class="flow" d="M764 200 H814" stroke="#9198a1" stroke-width="2.6"/>
<path d="M886 200 C930 200 930 110 980 110" fill="none" stroke="#30363d" stroke-width="2"/>
<path class="flow d0" d="M886 200 C930 200 930 110 980 110" fill="none" stroke="#2dd4bf" stroke-width="2.6"/>
<path d="M886 200 H980" fill="none" stroke="#30363d" stroke-width="2"/>
<path class="flow d1" d="M886 200 H980" fill="none" stroke="#818cf8" stroke-width="2.6"/>
<path d="M886 200 C930 200 930 290 980 290" fill="none" stroke="#30363d" stroke-width="2"/>
<path class="flow d2" d="M886 200 C930 200 930 290 980 290" fill="none" stroke="#fb923c" stroke-width="2.6"/>
<polygon points="850,164 886,200 850,236 814,200" fill="#161b22" stroke="url(#mark)" stroke-width="2.5" stroke-linejoin="round"/>
<text x="850" y="204" font-size="13" font-weight="700" fill="#e6edf3" text-anchor="middle">judge</text>
<path d="M932 68 V332" stroke="#ff7b72" stroke-width="2" stroke-dasharray="3 6" stroke-linecap="round" opacity=".8"/>
<path transform="translate(932 50) scale(1.0)" d="M0 -10 L8.5 -6.8 V0 C8.5 6 4.6 9.4 0 11 C-4.6 9.4 -8.5 6 -8.5 0 V-6.8 Z" fill="none" stroke="#ff7b72" stroke-width="2" stroke-linejoin="round"/><path transform="translate(932 50) scale(1.0)" d="M-3.6 0.4 L-0.8 3.2 L4 -2.4" fill="none" stroke="#ff7b72" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="932" y="354" font-size="13" font-weight="600" fill="#ff7b72" text-anchor="middle">guard</text>
<rect x="980" y="84" width="240" height="52" rx="26" fill="#161b22" stroke="#30363d"/>
<circle cx="1007" cy="110" r="11" fill="#2dd4bf" fill-opacity=".18"/>
<circle cx="1007" cy="110" r="5.5" fill="#2dd4bf"/>
<text x="1028" y="115.5" font-size="15" font-weight="700" letter-spacing="1" fill="#e6edf3">FAST</text>
<text x="1196" y="115.5" font-size="15" fill="#9198a1" text-anchor="end" class="mono">haiku</text>
<rect x="980" y="174" width="240" height="52" rx="26" fill="#161b22" stroke="#30363d"/>
<circle cx="1007" cy="200" r="11" fill="#818cf8" fill-opacity=".18"/>
<circle cx="1007" cy="200" r="5.5" fill="#818cf8"/>
<text x="1028" y="205.5" font-size="15" font-weight="700" letter-spacing="1" fill="#e6edf3">STANDARD</text>
<text x="1196" y="205.5" font-size="15" fill="#9198a1" text-anchor="end" class="mono">sonnet</text>
<rect x="980" y="264" width="240" height="52" rx="26" fill="#161b22" stroke="#30363d"/>
<circle cx="1007" cy="290" r="11" fill="#fb923c" fill-opacity=".18"/>
<circle cx="1007" cy="290" r="5.5" fill="#fb923c"/>
<text x="1028" y="295.5" font-size="15" font-weight="700" letter-spacing="1" fill="#e6edf3">DEEP</text>
<text x="1196" y="295.5" font-size="15" fill="#9198a1" text-anchor="end" class="mono">opus</text>
</svg>
