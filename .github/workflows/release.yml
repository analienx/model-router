name: Release

# Publishes the offline zip and SETUP-offline.md on a GitHub release, with that version's CHANGELOG.md section as
# the notes. Either way works, and running both is safe:
#   - on GitHub: Releases -> Draft a new release -> tag v1.2.1 on main -> Publish
#   - from a clone: git tag v1.2.1 && git push origin v1.2.1
# The tag must match VERSION in router/common.py.

on:
  push:
    tags: ["v*.*.*"]
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: publish ${{ github.ref_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Tag matches router/common.py
        run: |
          v=$(sed -n 's/^VERSION = "\(.*\)"$/\1/p' router/common.py)
          if [ "v$v" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match VERSION $v in router/common.py"; exit 1
          fi
          echo "VERSION=$v" >> "$GITHUB_ENV"
      - name: Unit tests
        run: python -m unittest discover -s tests
      - name: Build the offline bundle
        run: python scripts/build_bundle.py --out dist
      - name: Release notes from CHANGELOG.md
        run: |
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error::CHANGELOG.md has no section for $VERSION"; exit 1
          fi
          {
            echo
            echo "### Downloads"
            echo
            echo "- \`claude-model-router-$VERSION.zip\`: everything needed to install, plus \`SETUP.md\`."
            echo "- \`SETUP-offline.md\`: the full guide and the source of every file, with SHA-256 checksums, for mail systems that block attachments."
            echo
            echo "SHA-256:"
            echo '```'
            (cd dist && sha256sum ./*.zip SETUP-offline.md | sed 's#\./##')
            echo '```'
          } >> notes.md
          cat notes.md
      - name: Publish or update the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          if ! gh release view "$tag" >/dev/null 2>&1 &&
             gh release create "$tag" dist/*.zip dist/SETUP-offline.md \
               --title "model-router $VERSION" --notes-file notes.md --verify-tag; then
            exit 0
          fi
          # The release already exists (published on GitHub, or by the other trigger): attach the files and notes.
          gh release upload "$tag" dist/*.zip dist/SETUP-offline.md --clobber
          gh release edit "$tag" --title "model-router $VERSION" --notes-file notes.md
