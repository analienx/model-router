name: Unit tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 1"   # weekly: also catches new Python pre-releases

permissions:
  contents: read

concurrency:
  group: unit-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  unit:
    name: unit · ${{ matrix.os }} · py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04,   python: "3.8" }
          - { os: ubuntu-latest,  python: "3.12" }
          - { os: ubuntu-latest,  python: "3.14" }
          - { os: windows-latest, python: "3.8" }
          - { os: windows-latest, python: "3.13" }
          - { os: macos-latest,   python: "3.10" }
          - { os: macos-latest,   python: "3.13" }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true
      - name: Unit tests (fake claude, no network)
        run: python -m unittest discover -s tests -v

  bundle:
    name: offline bundle + README images
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build zip + SETUP-offline.md
        run: python scripts/build_bundle.py --out dist
      - name: The extracted zip passes its own self-tests
        run: |
          mkdir extracted
          python -m zipfile -e dist/claude-model-router-*.zip extracted
          cd extracted/claude-model-router-*
          python -m unittest discover -s tests
      - name: Rebuilding gives the identical zip
        run: |
          sleep 2
          python scripts/build_bundle.py --out dist-again
          cmp dist/claude-model-router-*.zip dist-again/claude-model-router-*.zip
      - name: README images match scripts/build_assets.py
        run: |
          python scripts/build_assets.py
          if [ -n "$(git status --porcelain -- docs/assets)" ]; then
            git status --porcelain -- docs/assets
            echo "::error::docs/assets is out of date: run python scripts/build_assets.py and commit the result"
            exit 1
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: offline-bundle
          path: dist
